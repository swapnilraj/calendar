name: Android

on:
  push:
    branches: [main, codex/daily-driver]
  pull_request:
    branches: [main, codex/daily-driver]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: scripts/setup-android-sdk.sh
      - name: Test and build
        run: ./gradlew test :app:assembleDebug :app:lintDebug
      - name: Preserve test and lint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daylight-diagnostics-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/test-results/**/TEST-*.xml
            app/build/reports/tests/
            app/build/outputs/roborazzi/
            app/build/reports/lint-results-debug.*
            calendar-core/build/test-results/**/TEST-*.xml
            calendar-core/build/reports/tests/
            weather/build/test-results/**/TEST-*.xml
            weather/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
