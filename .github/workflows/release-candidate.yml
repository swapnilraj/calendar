name: Signed release candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
      version_name:
        description: Version name, for example 0.2.0-beta.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: daylight-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: release-signing
    env:
      CANDIDATE_CODE: ${{ inputs.version_code }}
      CANDIDATE_VERSION: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and signing configuration
        env:
          KEYSTORE: ${{ secrets.DAYLIGHT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYLIGHT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYLIGHT_KEY_PASSWORD }}
          CERTIFICATE: ${{ vars.DAYLIGHT_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import os, re
          code = os.environ['CANDIDATE_CODE']
          assert re.fullmatch(r'[1-9][0-9]{0,9}', code) and int(code) <= 2100000000, 'Invalid version code'
          assert len(os.environ['CANDIDATE_VERSION']) <= 64 and re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', os.environ['CANDIDATE_VERSION']), 'Invalid version name'
          for key in ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'):
              assert os.environ[key], 'Missing signing configuration: ' + key
          assert re.fullmatch(r'[0-9a-fA-F: ]{64,95}', os.environ['CERTIFICATE']), 'Missing certificate fingerprint'
          PY
      - name: Refuse a reused or decreasing version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/daylight-release-tags.txt"
          python3 - <<'PY'
          import os, pathlib, re
          tags = pathlib.Path(os.environ['RUNNER_TEMP'], 'daylight-release-tags.txt').read_text().splitlines()
          prior = [int(m.group(1)) for tag in tags if (m := re.fullmatch(r'daylight-v.+-([0-9]+)', tag))]
          assert int(os.environ['CANDIDATE_CODE']) > max(prior + [1]), 'Version code must increase beyond every existing candidate'
          PY
      - name: Install Android SDK
        run: scripts/setup-android-sdk.sh
      - name: Verify and build candidate
        run: ./gradlew test :app:assembleDebug :app:lintDebug :app:assembleRelease -Pdaylight.versionCode="$CANDIDATE_CODE" -Pdaylight.versionName="$CANDIDATE_VERSION"
      - name: Check embedded package and version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          tool = pathlib.Path(os.environ['ANDROID_HOME'], 'build-tools/37.0.0/aapt2')
          data = subprocess.check_output([str(tool), 'dump', 'badging', 'app/build/outputs/apk/release/app-release-unsigned.apk'], text=True)
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", data, re.M)
          assert package and package.groups() == ('dev.swapnilraj.calendar', os.environ['CANDIDATE_CODE'], os.environ['CANDIDATE_VERSION']), 'Unexpected APK package/version'
          PY
      - name: Sign with the owner's stable identity
        env:
          DAYLIGHT_KEYSTORE_B64: ${{ secrets.DAYLIGHT_KEYSTORE_B64 }}
          DAYLIGHT_KEYSTORE_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
          DAYLIGHT_KEY_ALIAS: ${{ secrets.DAYLIGHT_KEY_ALIAS }}
          DAYLIGHT_KEY_PASSWORD: ${{ secrets.DAYLIGHT_KEY_PASSWORD }}
          DAYLIGHT_SIGNING_CERT_SHA256: ${{ vars.DAYLIGHT_SIGNING_CERT_SHA256 }}
        run: scripts/sign-release-candidate.sh app/build/outputs/apk/release/app-release-unsigned.apk "dist/daylight-${CANDIDATE_VERSION}-${CANDIDATE_CODE}.apk"
      - name: Prepare checksum and review notes
        run: |
          cd dist
          sha256sum -- *.apk > SHA256SUMS
          printf '%s\n' "Daylight ${CANDIDATE_VERSION} (${CANDIDATE_CODE})" "" "Source: ${GITHUB_SHA}" "" "The automated tests, debug APK, lint and release assembly passed for this source." "The APK signature matches the configured signing certificate." "" "This is a draft release candidate. Google/Workspace round-trips, device alarms/Doze/reboot/timezone/TalkBack, upgrade checks and the seven-day beta require recorded acceptance before publication." > RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-signed-candidate
          path: dist/
          if-no-files-found: error
      - name: Create durable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "daylight-v${CANDIDATE_VERSION}-${CANDIDATE_CODE}" dist/*.apk dist/SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "Daylight ${CANDIDATE_VERSION} candidate" --notes-file dist/RELEASE_NOTES.md
